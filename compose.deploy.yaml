services:
  web:
    image: ghcr.io/emna797/gestion-incidents:latest
    container_name: incidents-deploy
    ports:
      - "5000:5000"
    environment:
      DATABASE_PATH: /app/data/incidents.db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    restart: unless-stopped
    volumes:
      - incidents-data-deploy:/app/data

volumes:
  incidents-data-deploy:
