<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestion des incidents{% endblock %}</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --border: #e2e8f0;
      --danger: #dc2626;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .topbar {
      background: linear-gradient(135deg, #1e1b4b, #4f46e5);
      color: #fff;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
    }

    .topbar .inner {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .brand:hover {
      text-decoration: none;
    }

    .topbar nav a {
      color: #e0e7ff;
      margin-left: 18px;
      font-weight: 500;
    }

    .topbar nav a:hover {
      color: #fff;
      text-decoration: none;
    }

    main {
      max-width: 1000px;
      margin: 28px auto;
      padding: 0 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .06);
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .muted {
      color: var(--muted);
    }

    /* Boutons */
    .btn,
    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: #fff;
      border: 0;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .05s;
    }

    .btn:hover,
    button:hover {
      background: var(--primary-dark);
      text-decoration: none;
      color: #fff;
    }

    .btn:active,
    button:active {
      transform: translateY(1px);
    }

    .btn-light {
      background: #eef2ff;
      color: var(--primary);
    }

    .btn-light:hover {
      background: #e0e7ff;
      color: var(--primary-dark);
    }

    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    /* Statistiques */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      border-left: 5px solid var(--primary);
    }

    .stat .num {
      font-size: 28px;
      font-weight: 700;
    }

    .stat .lbl {
      color: var(--muted);
      font-size: 13px;
    }

    .stat.new {
      border-left-color: #3b82f6;
    }

    .stat.progress {
      border-left-color: #f59e0b;
    }

    .stat.done {
      border-left-color: #10b981;
    }

    /* Recherche + tableau */
    .search {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .search:focus,
    input:focus,
    textarea:focus,
    select:focus {
      outline: 2px solid #c7d2fe;
      border-color: var(--primary);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      padding: 10px 12px;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .incident-title {
      font-weight: 600;
      color: var(--text);
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .prio-low {
      background: #dcfce7;
      color: #166534;
    }

    .prio-mid {
      background: #fef3c7;
      color: #92400e;
    }

    .prio-high {
      background: #fee2e2;
      color: #991b1b;
    }

    .st-new {
      background: #dbeafe;
      color: #1e40af;
    }

    .st-progress {
      background: #ffedd5;
      color: #9a3412;
    }

    .st-done {
      background: #d1fae5;
      color: #065f46;
    }

    /* Formulaires */
    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: #fff;
    }

    .form-actions {
      margin-top: 22px;
      display: flex;
      gap: 10px;
    }

    /* Détails */
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 18px 0;
    }

    .detail-item .k {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: .05em;
    }

    .detail-item .v {
      font-weight: 600;
      margin-top: 4px;
    }

    .desc-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .actions form {
      margin: 0;
    }

    .inline-form {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .inline-form label {
      margin: 0 0 6px;
    }

    .inline-form select {
      width: auto;
      min-width: 160px;
    }

    /* Messages */
    .flash {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-weight: 500;
    }

    .flash.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .flash.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: var(--muted);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin: 30px 0;
    }

    @media (max-width: 720px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .col-lieu {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="inner">
      <a class="brand" href="{{ url_for('index') }}">🛠️ Incidents IT</a>
      <nav>
        <a href="{{ url_for('index') }}">Liste</a>
        <a href="{{ url_for('add_incident') }}">Nouvel incident</a>
      </nav>
    </div>
  </div>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>

</html>
